name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn -B verify --file pom.xml
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: loopy-jar
          path: target/loopy-*.jar
          if-no-files-found: error
          retention-days: 7
      
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loopy-dist
          path: |
            target/loopy-*-dist.zip
            target/loopy-*-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

  test-wrapper-scripts:
    name: Test Wrapper Scripts (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: loopy-dist
          path: dist/
      
      - name: Extract distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -xzf loopy-*-dist.tar.gz
          echo "LOOPY_DIR=$(ls -d loopy-*/)" >> $GITHUB_ENV
      
      - name: Extract distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Expand-Archive -Path loopy-*-dist.zip -DestinationPath .
          $loopyDir = (Get-ChildItem -Directory -Name loopy-*)
          echo "LOOPY_DIR=$loopyDir" >> $env:GITHUB_ENV
      
      - name: Test wrapper script (Unix)
        if: runner.os != 'Windows'
        run: |
          cd "dist/${{ env.LOOPY_DIR }}"
          chmod +x loopy
          echo "Testing --version..."
          ./loopy --version
          echo "Testing --help..."
          ./loopy --help
          echo "✅ Unix wrapper script tests passed!"
      
      - name: Test wrapper script (Windows CMD)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd "dist\${{ env.LOOPY_DIR }}"
          echo Testing --version...
          loopy.bat --version
          echo Testing --help...
          loopy.bat --help
          echo Windows CMD wrapper script tests passed!
      
      - name: Test wrapper script (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "dist/${{ env.LOOPY_DIR }}"
          Write-Host "Testing --version..."
          ./loopy.ps1 --version
          Write-Host "Testing --help..."
          ./loopy.ps1 --help
          Write-Host "✅ Windows PowerShell wrapper script tests passed!"
