# E-commerce Workload Example
# This YAML file defines a simulated e-commerce workload with read/write patterns
# for testing Neo4j performance under realistic conditions.
#
# Transaction Mode Reference
# --------------------------
# Each query (or transaction group) can optionally override the global --transaction-mode
# using the `transactionMode` field. When omitted, the global mode applies.
#
# Available modes:
#   auto-commit    - session.run()             - single query, no retry, minimal overhead
#   explicit       - beginTransaction()/commit() - full control, no driver retry
#   managed-read   - session.executeRead(cb)   - driver retry + read routing
#   managed-write  - session.executeWrite(cb)  - driver retry + write routing
#   execute-query  - driver.executeQuery()     - convenience API, automatic routing

name: "E-commerce Workload"
description: "Simulates typical e-commerce read/write patterns with user lookups, product searches, order creation, and inventory updates"

queries:
  # High-frequency read: User lookup by ID
  # Uses managed-read to demonstrate driver retry and read routing.
  - id: "find-user-by-id"
    cypher: "MATCH (u:User {id: $userId}) RETURN u"
    weight: 30
    type: read
    transactionMode: managed-read
    parameters:
      userId: "random:uuid"

  # High-frequency read: Product text search
  # Uses the driver.executeQuery() API to demonstrate automatic routing detection.
  - id: "product-search"
    cypher: "MATCH (p:Product) WHERE p.name CONTAINS $term RETURN p LIMIT 20"
    weight: 50
    type: read
    transactionMode: execute-query
    parameters:
      term: "random:string:5"

  # Medium-frequency read: Get user's recent orders
  - id: "get-user-orders"
    cypher: |
      MATCH (u:User {id: $userId})-[:PLACED]->(o:Order)
      RETURN o
      ORDER BY o.created DESC
      LIMIT 10
    weight: 20
    type: read
    parameters:
      userId: "random:uuid"

  # Low-frequency read: Product recommendations
  - id: "product-recommendations"
    cypher: |
      MATCH (p:Product {id: $productId})<-[:CONTAINS]-(o:Order)-[:CONTAINS]->(rec:Product)
      WHERE p <> rec
      RETURN rec.id AS productId, rec.name AS name, count(*) AS frequency
      ORDER BY frequency DESC
      LIMIT 5
    weight: 5
    type: read
    parameters:
      productId: "random:int:1:1000"

  # Low-frequency read: Get cart contents
  - id: "get-cart"
    cypher: |
      MATCH (u:User {id: $userId})-[r:HAS_IN_CART]->(p:Product)
      RETURN p.id AS productId, p.name AS name, r.quantity AS quantity
    weight: 10
    type: read
    parameters:
      userId: "random:uuid"

  # Low-frequency write: Add product to cart (auto-commit — no overhead needed here)
  - id: "add-to-cart"
    cypher: |
      MATCH (u:User {id: $userId}), (p:Product {id: $productId})
      MERGE (u)-[r:HAS_IN_CART]->(p)
      SET r.quantity = coalesce(r.quantity, 0) + 1
      RETURN r
    weight: 15
    type: write
    transactionMode: auto-commit
    parameters:
      userId: "random:uuid"
      productId: "random:int:1:10000"

# Transaction Groups
# ------------------
# Groups execute multiple queries atomically inside a single transaction.
# The group as a whole participates in weighted selection.
# Supported modes: explicit, managed-write (not execute-query — that API is per-query).

transactionGroups:

  # Order placement workflow: create order + update inventory as one atomic transaction.
  # Uses explicit mode so the application controls commit/rollback.
  - id: "place-order-workflow"
    description: "Create an order and decrement inventory atomically"
    weight: 10
    transactionMode: explicit
    queries:
      - id: "create-order"
        cypher: "CREATE (o:Order {id: $orderId, total: $amount, created: datetime()}) RETURN o"
        type: WRITE
        parameters:
          orderId: "random:uuid"
          amount: "random:double:0:1000"
      - id: "update-inventory"
        cypher: "MATCH (p:Product {id: $productId}) SET p.stock = coalesce(p.stock, 100) - 1 RETURN p"
        type: WRITE
        parameters:
          productId: "random:int:1:10000"

  # Managed-write group: driver retries both queries together on transient errors.
  - id: "managed-write-order-workflow"
    description: "Same workflow but with driver-managed retry"
    weight: 5
    transactionMode: managed-write
    queries:
      - id: "mw-create-order"
        cypher: "CREATE (o:Order {id: $orderId, total: $amount, created: datetime()}) RETURN o"
        type: WRITE
        parameters:
          orderId: "random:uuid"
          amount: "random:double:0:1000"
      - id: "mw-update-inventory"
        cypher: "MATCH (p:Product {id: $productId}) SET p.stock = coalesce(p.stock, 100) - 1 RETURN p"
        type: WRITE
        parameters:
          productId: "random:int:1:10000"

# Weight Distribution Summary:
# - Individual read queries:  30 + 50 + 20 + 5 + 10 = 115
# - Individual write queries: 15
# - Transaction groups:       10 + 5 = 15
# Total weight: 145

# Parameter Generator Reference:
# - random:uuid           - Generates a random UUID string
# - random:int:min:max    - Generates a random integer between min and max (inclusive)
# - random:double:min:max - Generates a random double between min and max
# - random:string:length  - Generates a random alphanumeric string of given length
# - random:long:min:max   - Generates a random long between min and max
# - random:boolean        - Generates a random true/false value
# - Literal values        - Any string not starting with "random:" is used as-is
